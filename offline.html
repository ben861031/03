<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>目前無法連線｜發文時程管理平台</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#f8fbff,#eef2f7);font-family:"Noto Sans TC",system-ui,sans-serif;color:#0f172a}.offline-card{width:min(100%,420px);padding:32px 26px;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 18px 45px rgba(15,23,42,.09)}img{width:88px;height:88px;border-radius:22px;margin-bottom:18px}h1{margin:0 0 12px;font-size:24px}p{margin:0 0 22px;color:#64748b;line-height:1.75;font-size:15px}button{width:100%;min-height:48px;border:0;border-radius:14px;background:#2563eb;color:#fff;font-size:16px;font-weight:700;cursor:pointer}small{display:block;margin-top:18px;color:#94a3b8;line-height:1.6}
  </style>
</head>
<body>
  <main class="offline-card">
    <img src="assets/icons/app-icon-white-192.png" alt="發文時程管理平台">
    <h1>目前無法連線</h1>
    <p>請確認網路連線後再重新嘗試。為保護公文與帳號資料，本系統不會將 Firebase 資料保存在離線快取中。</p>
    <button type="button" onclick="location.reload()">重新連線</button>

  </main>
