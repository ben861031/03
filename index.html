<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://firestore.googleapis.com wss://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://firebaseinstallations.googleapis.com https://firebaseappcheck.googleapis.com https://content-firebaseappcheck.googleapis.com https://www.gstatic.com https://www.google.com https://asia-east1-seal-management-68465.cloudfunctions.net; frame-src https://www.google.com https://www.recaptcha.net; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="發文管理">
<title>發文時程管理平台</title>
<link rel="icon" type="image/png" href="assets/icons/favicon.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-white.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div id="app"></div>
    <script>
      window.onerror = function(msg, url, line) {
        const app = document.getElementById('app');
        if (!app) return;
        const errorBox = document.createElement('div');
        errorBox.style.cssText = 'color:red;font-size:24px;padding:20px;';
        errorBox.textContent = `Error: ${String(msg)} (Line: ${Number(line) || 0})`;
        app.replaceChildren(errorBox);
      };
    </script>
    <!-- Sync Indicator -->
<div id="syncIndicator" class="sync-indicator hidden">
  <div class="sync-spinner"></div>
  <span id="syncText">同步中...</span>
</div>

<!-- Fullscreen Loader -->
  <div id="fullScreenLoader" class="fullscreen-loader">
  <div class="fs-spinner"></div>
  <div id="fsLoaderText" class="fs-text">系統載入中...</div>
</div>

<!-- Login Screen -->
<div id="loginModal" class="login-screen hidden">
  <div class="login-box clean-style">
    <div class="login-avatar">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"></path>
      </svg>
    </div>
    <div class="login-title">發文時程管理平台</div>
    <div class="login-divider"></div>
    
    <div class="login-input-group">
      <input type="text" id="loginAccount" class="pill-input" placeholder="員工編號">
      <input type="password" id="loginPassword" class="pill-input" placeholder="密碼">
    </div>
    
    <div id="loginError" class="login-error hidden">帳號或密碼錯誤</div>
    <button id="loginBtn" class="btn pill-btn">登入</button>
  </div>
</div>

<div id="changePasswordModal" class="login-screen hidden">
  <div class="login-box clean-style">
    <div class="login-title">首次登入變更密碼</div>
    <div class="login-divider"></div>
    <p style="font-size:13px;color:#64748b;margin:0 0 12px;">臨時密碼只能用於首次登入，請立即設定 8–128 碼個人密碼；不限制大小寫、數字或符號組合。</p>
    <div class="login-input-group">
      <input type="password" id="newPassword" class="pill-input" autocomplete="new-password" placeholder="新密碼（至少 8 碼）">
      <input type="password" id="confirmNewPassword" class="pill-input" autocomplete="new-password" placeholder="再次輸入新密碼">
    </div>
    <div id="changePasswordError" class="login-error hidden"></div>
    <button id="changePasswordBtn" class="btn pill-btn" onclick="changeOwnPassword()">更新密碼</button>
  </div>
</div>

<script src="assets/js/app-config.js"></script>
<script type="module" src="assets/js/firebase-init.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pwa-init.js" defer></script>
</body>
</html>
